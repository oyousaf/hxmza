name: beds4u-dev
services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: beds4u
      POSTGRES_USER: beds4u
      POSTGRES_PASSWORD: beds4u_local_only
    ports: ['127.0.0.1:5433:5432']
    volumes: [dev_postgres:/var/lib/postgresql/data]
  redis:
    image: redis:7.4-bookworm
    ports: ['127.0.0.1:6379:6379']
    volumes: [dev_redis:/data]
volumes:
  dev_postgres:
  dev_redis:
